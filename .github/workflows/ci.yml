name: CI

# Test suites run ONCE, on the pull request (specs/cicd-release.md AC-001).
# Pushes to main/beta are handled by release.yml (tag, build, smoke, release);
# branch protection requires these jobs before a PR can merge.
on:
  pull_request:
    branches: [main, beta]
  schedule:
    - cron: '0 9 * * 1'  # Monday 9 AM UTC — weekly dependency audit

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        # Pinned: the codebase is linted against this exact version. Unquoted
        # `ruff>=x` was a shell redirect and silently installed latest.
        run: pip install "ruff==0.15.2"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Mypy
        run: mypy app/

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests with coverage (>= 80%)
        run: npm run test:coverage

      - name: Build
        run: npm run build

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Build and run tests
        run: |
          docker compose -f docker-compose.dev.yml run --rm -e COVERAGE_FILE=/tmp/.coverage test \
            pytest tests/ --ignore=tests/e2e --ignore=tests/smoke --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.dev.yml down
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and pip-audit
        # setuptools is audited too; the runner's bundled copy lags behind fixes
        run: |
          pip install --upgrade pip setuptools
          pip install -r requirements.txt pip-audit

      - name: Run pip-audit
        run: pip-audit
