<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Rsync Viewer">
  <!-- Rsync Viewer brand mark: two arrows chasing in a sync loop around a green status dot.
       Source of truth for the UI; raster icons in frontend/public are derived. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0f172a"/>
  <g id="arrow">
    <path d="M 123.6 326.4 A 150 150 0 0 1 326.4 123.6" fill="none" stroke="url(#g)" stroke-width="60" stroke-linecap="round"/>
    <path d="M -10 -64 L 92 0 L -10 64 Z" fill="url(#g)" transform="translate(326.4 123.6) rotate(388)"/>
  </g>
  <use href="#arrow" transform="rotate(180 256 256)"/>
  <circle cx="256" cy="256" r="46" fill="#22c55e"/>
  <circle cx="270" cy="243" r="12" fill="#0f172a" opacity="0.85"/>
</svg>
